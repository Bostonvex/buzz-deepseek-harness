# DeepSeek Harness ACP composition for Buzz and an OpenAI-compatible endpoint.
# Stdout is reserved exclusively for ACP JSON-RPC frames.

- id: llm-local
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local:
        displayName: !!js "process.env.DSH_PROVIDER_NAME ?? 'Twin DGX Spark'"
        apiKeyEnv: !!js "process.env.DSH_API_KEY_ENV ?? 'DSH_LOCAL_API_KEY'"
        api: !!js "process.env.DSH_API_PROTOCOL ?? 'openai-completions'"
        baseURL: !!js "process.env.DSH_BASE_URL ?? 'http://127.0.0.1:8000/v1'"
        compat:
          supportsDeveloperRole: false
          supportsUsageInStreaming: true
          maxTokensField: max_tokens
        streamIdleTimeoutMs: 600000
        retryPolicy:
          mode: normal
          maxRetries: 1
        models:
          - id: !!js "process.env.DSH_MODEL_ID ?? 'ds-0731'"
            name: !!js "process.env.DSH_MODEL_NAME ?? 'DeepSeek V4 Flash'"
            contextWindow: !!js "Number(process.env.DSH_CONTEXT_WINDOW ?? 1048576)"
            maxTokens: !!js "Number(process.env.DSH_MAX_TOKENS ?? 16384)"

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: './buzz-bash-sandbox.mjs'
  config:
    timeoutMs: 120000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: local
    model: !!js "process.env.DSH_MODEL_ID ?? 'ds-0731'"
    maxParallelToolCalls: 1
    persistenceRoot: !!js "process.env.DSH_ACP_SESSIONS_ROOT ?? `${process.env.HOME}/.dsh/acp-sessions`"
    workspaceContext:
      maxBytes: 65536
    skills:
      enabled: false
    toolJobs: false
    goals: false
    persona: |
      You are DeepSeek Harness, an English-speaking coding assistant powered by {{model}}. Your working directory is {{cwd}}.

      Use the available filesystem and bash tools to inspect, edit, and verify work. Keep all changes inside the requested workspace unless the client grants a wider one-shot permission. Reply in English unless the user explicitly requests another language. Keep final answers concise and factual.

      The built-in bash environment supports Buzz CLI commands. If a Buzz operation fails, report the exact error and stop; never search environment files, application configuration, managed-agent records, keychains, or key stores for credential material. BUZZ_AUTH_TAG identifies the owner attestation, not the event signer; use the accepted event pubkey when signer identity must be verified.

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

# The compatibility proxy configures this plugin over a private parent/child
# IPC channel after it has validated Buzz's local MCP sidecar. The official
# DeepSeek ACP bridge still receives an empty mcpServers array.
- id: buzz-mcp-control
  name: './buzz-mcp-control.mjs'
